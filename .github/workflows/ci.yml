name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, types, unit tests, data gates, build, e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check application
        run: npm run typecheck

      - name: Type-check tests, scripts and configs
        run: npm run typecheck:tests

      - name: Unit and component tests with coverage
        run: npm run test:coverage

      - name: Synthetic dataset is byte-identical to data/
        run: npm run check:data

      - name: No skipped or focused tests
        run: npm run check:noskip

      - name: Production build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests against the production bundle
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 14
          if-no-files-found: ignore
